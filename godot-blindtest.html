<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Godot vs Three.js 视觉盲测</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: #0b0f12;
        color: #e8f1ea;
        font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
      }
      header {
        padding: 22px 28px;
        border-bottom: 1px solid rgba(255,255,255,0.12);
        display: flex;
        align-items: baseline;
        gap: 18px;
      }
      header h1 { margin: 0; font-size: 22px; letter-spacing: 2px; }
      header span { opacity: 0.65; font-size: 13px; }
      main { max-width: 1560px; margin: 0 auto; padding: 28px; }
      .title { margin: 0 0 14px; font-size: 15px; opacity: 0.85; }
      .stage { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
      .option {
        position: relative;
        border: 1px solid rgba(255,255,255,0.18);
        background: #11181c;
        cursor: pointer;
        overflow: hidden;
      }
      .option img { width: 100%; display: block; aspect-ratio: 16/9; object-fit: cover; }
      .option .label {
        position: absolute;
        left: 14px;
        top: 12px;
        width: 52px;
        height: 52px;
        display: grid;
        place-items: center;
        background: rgba(5,8,10,0.72);
        border: 1px solid rgba(255,255,255,0.5);
        font-size: 24px;
        font-weight: 800;
      }
      .option:hover { border-color: #7dffb0; box-shadow: 0 0 0 2px rgba(125,255,176,0.25); }
      .option.revealed { cursor: default; }
      .result {
        position: absolute;
        right: 14px;
        bottom: 12px;
        padding: 8px 14px;
        background: rgba(5,8,10,0.78);
        border-left: 3px solid #7dffb0;
        font-size: 14px;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .option.revealed .result { opacity: 1; }
      .controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 18px;
        min-height: 46px;
      }
      button {
        padding: 10px 24px;
        background: #17261f;
        color: #eafff3;
        border: 1px solid rgba(140,255,190,0.45);
        font-size: 15px;
        cursor: pointer;
      }
      button:disabled { opacity: 0.4; cursor: default; }
      #tally { font-size: 14px; opacity: 0.85; }
      @media (max-width: 760px) {
        .stage { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>视觉盲测</h1>
      <span>凭直觉选择视觉效果更优的一张，选择后揭示引擎标签</span>
    </header>
    <main>
      <div class="title" id="roundTitle"></div>
      <div class="stage" id="stage"></div>
      <div class="controls">
        <div id="tally"></div>
        <div>
          <button id="next" disabled>下一组</button>
          <button id="restart">重新开始</button>
        </div>
      </div>
    </main>
    <script>
      const stage = document.getElementById('stage');
      const nextBtn = document.getElementById('next');
      const restartBtn = document.getElementById('restart');
      const tally = document.getElementById('tally');
      const roundTitle = document.getElementById('roundTitle');
      let pairs = [];
      let index = 0;
      let scores = { godot: 0, three: 0 };

      async function init() {
        const res = await fetch('/screenshots/godot-manifest.json');
        const data = await res.json();
        pairs = data.pairs.slice();
        for (const pair of pairs) {
          if (Math.random() < 0.5) {
            [pair.a, pair.b] = [pair.b, pair.a];
          }
        }
        scores = { godot: 0, three: 0 };
        index = 0;
        render();
      }

      function render() {
        const pair = pairs[index];
        stage.innerHTML = '';
        roundTitle.textContent = `第 ${index + 1} / ${pairs.length} 组 · ${pair.title}`;
        tally.textContent = `Godot ${scores.godot} · Three.js ${scores.three}`;
        nextBtn.disabled = true;
        for (const key of ['a', 'b']) {
          const item = pair[key];
          const option = document.createElement('div');
          option.className = 'option';
          option.dataset.key = key;
          const img = document.createElement('img');
          img.src = `/screenshots/${item.file}`;
          img.alt = key.toUpperCase();
          const label = document.createElement('div');
          label.className = 'label';
          label.textContent = key.toUpperCase();
          const result = document.createElement('div');
          result.className = 'result';
          result.textContent = item.label;
          option.append(img, label, result);
          option.addEventListener('click', () => choose(key));
          stage.appendChild(option);
        }
      }

      function choose(key) {
        const pair = pairs[index];
        const chosen = pair[key].label.toLowerCase();
        scores[chosen] += 1;
        document.querySelectorAll('.option').forEach((el) => {
          el.classList.add('revealed');
          el.querySelector('.result').textContent = pair[el.dataset.key].label;
        });
        nextBtn.disabled = false;
      }

      nextBtn.addEventListener('click', () => {
        index += 1;
        if (index >= pairs.length) {
          const winner = scores.godot >= scores.three ? 'Godot' : 'Three.js';
          stage.innerHTML = `<div style="grid-column:1/-1;padding:60px;text-align:center;font-size:24px;border:1px solid rgba(255,255,255,.2)">
            盲测完成：Godot ${scores.godot} 票，Three.js ${scores.three} 票，胜者是 ${winner}
          </div>`;
          roundTitle.textContent = '本轮盲测已结束';
          nextBtn.disabled = true;
          return;
        }
        render();
      });

      restartBtn.addEventListener('click', init);
      init();
    </script>
  </body>
</html>
